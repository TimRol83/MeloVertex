name: Build MeloVertex iOS 15 TIPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main, XC-ios-ht ]

jobs:
  build-tipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ldid
        run: brew install ldid

      - name: Publish Ryujinx.Headless.SDL2 NativeAOT (ios-arm64)
        run: |
          dotnet publish src/Ryujinx.Headless.SDL2/Ryujinx.Headless.SDL2.csproj \
            -c Release \
            -r ios-arm64 \
            --self-contained true

      - name: Build MeloNX iOS 15 App
        run: |
          xcodebuild \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign with MeloNX-hv.entitlements and Package .tipa
        run: |
          APP="build/Build/Products/Release-iphoneos/MeloNX.app"
          ldid -SMeloNX-hv.entitlements "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/MeloNX.app
          zip -qry MeloVertex-iOS15-MemGuard.tipa Payload

      - name: Upload .tipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeloVertex-iOS15-MemGuard
          path: MeloVertex-iOS15-MemGuard.tipa
